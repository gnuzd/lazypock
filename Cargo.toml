[workspace]
members = ["crates/app","crates/core"]
[workspace.package]
version = "0.30.0"
edition = "2024"
license = "MIT"
authors = ["lazypock contributors"]
repository = "https://github.com/gnuzd/lazypock"
homepage = "https://lazypock.gnuzd.dev"
description = "lazypock — a backend-as-a-service in Rust + Postgres"

[workspace.dependencies]
# Async runtime & HTTP
axum = "0.8"
tokio = { version = "1", features = ["full"] }

# Error handling & utilities
thiserror = "1.0"

lazypock-core = { path = "crates/core" }
# lazypock-db = { path = "crates/db" }
# lazypock-api = { path = "crates/api" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
incremental = false
