[workspace]
members = ["crates/api","crates/app","crates/core"]
[workspace.package]
version = "0.30.0"
edition = "2024"
license = "MIT"
authors = ["lazypock contributors"]
repository = "https://github.com/gnuzd/lazypock"
homepage = "https://lazypock.gnuzd.dev"
description = "lazypock — a backend-as-a-service in Rust + Postgres"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"

# Error handling & utilities
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"

lazypock-core = { path = "crates/core" }
lazypock-api = { path = "crates/api" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
incremental = false
