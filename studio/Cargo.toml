[package]
name = "nsh-app-studio"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.5.1"
nsh-base = "0.5.1"
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.1", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.5.1", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.5.1", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[profile.release]
opt-level = "z"        # Tối ưu kích thước tối đa (hoặc dùng "s" nếu "z" làm chậm UI)
lto = true             # Link-Time Optimization toàn cục
codegen-units = 1      # Giảm đơn vị biên dịch để tối ưu sâu hơn
panic = "abort"        # Bỏ cơ chế stack unwinding khi crash, giảm đáng kể dung lượng
strip = true
