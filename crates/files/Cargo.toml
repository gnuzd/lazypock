[package]
name = "lazypock-files"
description = "lazypock file storage: upload validation and the storage backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
bytes = "1.12.1"
hmac = "0.13.0"
lazypock-core.workspace = true
lazypock-db.workspace = true
serde_json = "1.0.154"
sha2 = "0.11.0"
tokio = { version = "1.53.3", features = ["fs"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
