[package]
name = "lazypock-db"
description = "lazypock database layer: connection pool and migration runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
arc-swap = "1.9.2"
deadpool = "0.13.1"
deadpool-postgres = "0.14.2"
lazypock-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt", "time", "sync"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time"] }
