[package]
name = "lazypock-db"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true

[dependencies]
lazypock-core = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true}

tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-serde_json-1"] }
deadpool = "0.13.1"
deadpool-postgres = { version = "0.14", default-features = false, features = ["rt_tokio_1"] }
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
sea-query = { version = "0.32", default-features = false, features = ["backend-postgres", "with-json", "thread-safe"] }

