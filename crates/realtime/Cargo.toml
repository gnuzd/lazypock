[package]
name = "lazypock-realtime"
description = "lazypock realtime: change events, fan-out and subscriptions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
lazypock-core.workspace = true
lazypock-db.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "sync", "macros"] }
tokio-postgres = "0.7.18"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
