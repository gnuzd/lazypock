[package]
name = "lazypock-api"
description = "lazypock HTTP API: axum router, middleware and error mapping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
bytes = "1.12.1"
futures-util = "0.3.34"
lazypock-auth = { version = "0.1.0", path = "../auth" }
lazypock-core.workspace = true
lazypock-db = { version = "0.1.0", path = "../db" }
lazypock-files = { version = "0.1.0", path = "../files" }
lazypock-realtime = { version = "0.1.0", path = "../realtime" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt"] }
tracing = "0.1.44"

[dev-dependencies]
base64 = "0.23.1"
image = { version = "0.25.9", default-features = false, features = ["png"] }
serde_urlencoded = "0.7.1"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
