[package]
name = "lazypock-api"
description = "lazypock HTTP API: axum router, middleware and error mapping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
axum = "0.8.9"
lazypock-auth = { version = "0.1.0", path = "../auth" }
lazypock-core.workspace = true
lazypock-db = { version = "0.1.0", path = "../db" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt"] }
tracing = "0.1.44"

[dev-dependencies]
base64 = "0.23.1"
serde_urlencoded = "0.7.1"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
