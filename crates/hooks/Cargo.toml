[package]
name = "lazypock-hooks"
description = "lazypock TypeScript hooks: a QuickJS runtime with type stripping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
lazypock-core.workspace = true
lazypock-db = { path = "../db" }
oxc_allocator = "0.154"
oxc_codegen = "0.154"
oxc_parser = "0.154"
oxc_semantic = "0.154"
oxc_span = "0.154"
oxc_transformer = "0.154"
reqwest = { version = "0.13.5", features = ["blocking"] }
rquickjs = "0.14"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["sync"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
