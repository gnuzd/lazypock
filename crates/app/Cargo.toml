[package]
name = "lazypock"
description = "lazypock — a PocketBase-style backend-as-a-service in Rust + Postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
default-run = "lazypock"

[[bin]]
name = "lazypock"
path = "src/main.rs"

[dependencies]
lazypock-core.workspace = true
lazypock-db.workspace = true
lazypock-api.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
dotenvy = "0.15.7"
axum = "0.8.9"
lazypock-auth = { version = "0.1.0", path = "../auth" }
lazypock-realtime = { version = "0.1.0", path = "../realtime" }
lazypock-files = { version = "0.1.0", path = "../files" }
lazypock-hooks = { version = "0.1.0", path = "../hooks" }
