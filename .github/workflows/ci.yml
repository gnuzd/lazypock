name: CI

# Gates every change to the Rust server.
#
# This replaced the Elixir pipeline (`test.yml` and `release.yml`) that used to
# gate this repository: the rewrite merged into `main`, and those workflows left
# with the Elixir implementation.
#
# `push` is pinned to `main`: a bare `push` also fires for every branch that has
# a PR open — branches live in this repository, not in a fork — so the whole
# suite ran twice for the same commit. `pull_request` is the gate; the post-merge
# run keeps `main` known-good.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Off on purpose: the cache should make a rebuild fast, not incremental
  # state that can hide a warning the gate exists to catch.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The job never pushes, so leaving the token in .git/config only
          # gives a later step something to leak.
          persist-credentials: false
      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup show
          rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup show
          rustup component add clippy
      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      # `--all-targets` matters: tests and benches are code too, and a lint
      # that fires only in them is still a lint.
      - name: Lint
        run: >-
          cargo clippy --workspace --all-targets --all-features
          -- -D warnings

  thin:
    name: thin build (no image codecs)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the toolchain pinned by rust-toolchain.toml
        run: rustup show
      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      # The `local-image-codecs` feature exists so a deployment can leave the
      # codecs out and take thumbnails from `LAZYPOCK_IMAGE_SERVICE_URL`
      # instead. No other job builds that configuration, so without this one
      # a change that only breaks the thin build would ship.
      - name: Check without the codecs
        run: >-
          RUSTFLAGS="-D warnings"
          cargo check --workspace --no-default-features

  test:
    name: cargo test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lazypock_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Every test creates its own randomly named schema, so one database
      # serves them all. The value matches the tests' own default, so an
      # unset variable cannot silently point them somewhere else.
      LAZYPOCK_TEST_DATABASE_URL: >-
        postgres://postgres:postgres@localhost:5432/lazypock_dev
      # Without this the integration tests log "Postgres unreachable" and
      # *pass*, so a service container that never came up would read as a
      # green suite that tested nothing. This makes that case a failure.
      LAZYPOCK_REQUIRE_DB_TESTS: "1"
      # `lld` links the ~57 test binaries far faster than the default GNU ld,
      # and this job is roughly half build rather than test. Measured on this
      # repository: the build phase of this job went from 134s to 68s, which is
      # where the whole gain in this change comes from.
      #
      # CI only, on purpose: this is a `RUSTFLAGS` value in one job, so it cannot
      # affect the release image, which keeps the default linker. Deleting this
      # line and the `Install lld` step below reverts it completely.
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the toolchain pinned by rust-toolchain.toml
        run: rustup show
      - name: Install lld
        # Deliberately no `apt-get update`: the runner image's package lists are
        # current enough for `lld`, and the update on its own costs ~15s.
        run: sudo apt-get install -y lld
      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      # `cargo test`, NOT `cargo nextest`.
      #
      # nextest was tried here and reverted. It runs each of the 755 tests in its
      # own process, which on a 4-vCPU runner against a cold Postgres costs more
      # than the parallelism saves: over two runs the test phase measured 162-167s
      # under nextest against 106s under `cargo test`. It *looked* like a win
      # locally (755 tests in 51s, against 65-115s), because that machine has more
      # cores and a database whose test schemas already existed from earlier runs.
      # Do not reintroduce it without measuring it in CI.
      - run: cargo test --workspace

  studio:
    name: studio build
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # The SDK is a published package (`lazypock`), so nothing outside this
      # repository is needed to build the Studio.
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Install
        working-directory: studio
        run: bun install --frozen-lockfile
      # `vite build` does not type-check, so without this a broken import —
      # `sseUrlFromBaseUrl` renamed in the SDK, say — would build cleanly and
      # then fail in the browser.
      - name: Type-check
        working-directory: studio
        run: bun run check
      - name: Build
        working-directory: studio
        run: bun run build
      # Hand the SPA to the embed crate the way the release image does, so the
      # handoff is checked rather than assumed.
      - name: Embed the built Studio
        run: >-
          LAZYPOCK_STUDIO_DIR=studio/build/studio
          cargo test -p lazypock-studio-embed
