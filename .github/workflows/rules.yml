name: Rule Engine

# Focused, path-filtered suite for the access-control code path: the rule
# enforcer, the filter compiler/parser it delegates to, the realtime channel
# join gate, and the auth token verification the enforcer depends on.
#
# These are security-sensitive modules, so they get their own signal instead of
# only being covered by the full suite. The nightly schedule re-runs the
# property-based fuzzing with far more iterations than a PR run.
on:
  push:
    paths:
      - "core/lib/lazypock/rules/**"
      - "core/lib/lazypock/schemas/filter_compiler.ex"
      - "core/lib/lazypock/schemas/generic_record.ex"
      - "core/lib/lazypock/auth/token.ex"
      - "core/lib/lazypock_web/channels/**"
      - "core/lib/lazypock_web/controllers/dynamic_controller.ex"
      - "core/test/lazypock/rules/**"
      - "core/test/lazypock/schemas/filter_compiler*"
      - "core/test/lazypock/auth/token_test.exs"
      - "core/test/lazypock_web/channels/**"
      - "core/test/lazypock_web/controllers/rule_side_channel_test.exs"
      - "core/test/lazypock_web/controllers/dynamic_controller_test.exs"
      - "core/scripts/check_rule_coverage.exs"
      - ".github/workflows/rules.yml"
  pull_request:
    paths:
      - "core/lib/lazypock/rules/**"
      - "core/lib/lazypock/schemas/filter_compiler.ex"
      - "core/lib/lazypock/schemas/generic_record.ex"
      - "core/lib/lazypock/auth/token.ex"
      - "core/lib/lazypock_web/channels/**"
      - "core/lib/lazypock_web/controllers/dynamic_controller.ex"
      - "core/test/lazypock/rules/**"
      - "core/test/lazypock/schemas/filter_compiler*"
      - "core/test/lazypock/auth/token_test.exs"
      - "core/test/lazypock_web/channels/**"
      - "core/test/lazypock_web/controllers/rule_side_channel_test.exs"
      - "core/test/lazypock_web/controllers/dynamic_controller_test.exs"
      - "core/scripts/check_rule_coverage.exs"
      - ".github/workflows/rules.yml"
  schedule:
    # Nightly deeper fuzzing of the filter parser/evaluator.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # PR runs use the default (300) iteration count; the nightly run fuzzes much
  # harder. See PROPERTY_MAX_RUNS in
  # core/test/lazypock/schemas/filter_compiler_property_test.exs.
  PROPERTY_MAX_RUNS: ${{ github.event_name == 'schedule' && '20000' || '300' }}

jobs:
  rules:
    name: rules + filter compiler
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lazypock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir & Erlang
        uses: erlef/setup-beam@v1.18.2
        with:
          elixir-version: "1.17.3"
          otp-version: "27.1.2"

      - name: Install ImageMagick (shared test support needs `magick`/`convert`)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Install Mix deps
        working-directory: core
        run: mix deps.get

      - name: Run access-control suites
        working-directory: core
        env:
          MIX_ENV: test
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          mix test --max-cases 8 \
            test/lazypock/rules/ \
            test/lazypock/schemas/filter_compiler_test.exs \
            test/lazypock/schemas/filter_compiler_property_test.exs \
            test/lazypock/auth/token_test.exs \
            test/lazypock_web/channels/ \
            test/lazypock_web/controllers/rule_side_channel_test.exs \
            test/lazypock_web/controllers/dynamic_controller_test.exs \
            test/lazypock_web/controllers/view_collections_controller_test.exs
