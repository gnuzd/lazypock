name: Release

# Automatic release pipeline (replaces the old manual workflow_dispatch).
#
# Flow:
#   1. Every push to `main` that touches `core/` runs release-please. If the
#      commits since the last release include `fix:` / `feat:` / BREAKING
#      CHANGE (conventional commits), it opens (or updates) a release PR —
#      "chore(main): release core-vX.Y.Z" — with the `core/mix.exs` version
#      bump + `core/CHANGELOG.md`.
#   2. Merging that release PR pushes the bump to `main`, release-please
#      creates the GitHub Release + `vX.Y.Z` tag, and the build job in this
#      same run runs the test suite, builds the Burrito binaries (macOS +
#      Linux), and attaches them to the release.
#
# Commit messages on `main` should follow conventional commits
# (e.g. `fix(core): ...`, `feat(core): ...`, `chore: ...`) so the next
# version is chosen correctly. `BREAKING CHANGE:` in the body bumps major.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['core--release_created'] }}
      upload_url: ${{ steps.release.outputs['core--upload_url'] }}
      tag_name: ${{ steps.release.outputs['core--tag_name'] }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: elixir
          package-name: lazypock
          path: core

  # ── Only runs when release-please just created a release (release PR
  #    merged): checkout the released code, test it, build the Burrito
  #    binaries, and attach them to the release. ──
  build:
    name: Test, build & attach binaries
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lazypock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Elixir & Erlang
        uses: erlef/setup-beam@v1.18.2
        with:
          elixir-version: "1.17.3"
          otp-version: "27.1.2"

      - name: Setup Bun (studio SPA build)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Pin the exact Zig version Burrito requires (see core/mix.lock —
      # burrito 1.6.0 expects 0.16.0; the action's default is a dev build).
      - name: Setup Zig (burrito wrapper)
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Mix deps
        working-directory: core
        run: mix deps.get

      - name: Install Studio deps
        working-directory: studio
        run: bun install --frozen-lockfile

      # Ubuntu LTS ships ImageMagick 6, which provides `convert`/`identify` but
      # no `magick` binary; tests resolve `magick` or `convert` (see TestImage).
      - name: Install ImageMagick (tests need `magick`/`convert`)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Run tests
        working-directory: core
        env:
          MIX_ENV: test
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          # Retry once — the async suite has a known rare flake
          # (hooks RegistryTest :should_not_run race)
          mix test --max-cases 8 || mix test --max-cases 8

      - name: Deploy assets (studio build + phx.digest)
        working-directory: core
        run: mix assets.deploy

      - name: Build Burrito release
        working-directory: core
        env:
          MIX_ENV: prod
        run: |
          mix release --overwrite
          ls -la burrito_out/

      - name: Prepare release assets
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          mkdir -p dist
          cp core/burrito_out/lazypock_macos_silicon \
            "dist/lazypock-${VERSION}-darwin-arm64"
          cp core/burrito_out/lazypock_linux \
            "dist/lazypock-${VERSION}-linux-x86_64"
          chmod +x dist/*
          cd dist && sha256sum * > checksums-sha256.txt

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # v2 resolves the release by tag (upload_url was a v1-only input)
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            dist/lazypock-*
            dist/checksums-sha256.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
