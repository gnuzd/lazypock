name: Release

# Builds the container image and publishes it to GHCR, so a deployment can pull
# a built artifact instead of building one. Coolify supports either.
#
# Each architecture is built on a **native** runner rather than under QEMU. A
# Rust release build here is `lto = "fat"` with `codegen-units = 1`, and
# emulating that for arm64 costs far more than the build itself does; the Elixir
# pipeline this replaced chose native runners for the same reason.
#
# `workflow_dispatch` re-runs a publish without needing a new commit.
#
# The `release-please` job owns versions, tags and CHANGELOG.md. It was lost
# with the Elixir tree (`b409aa88`), which is why nothing was released after the
# Rust rewrite merged: no run bumps a version or creates a tag.
#
# Two things about it are not obvious, and are why it lives here rather than in
# a workflow of its own:
#
#   1. A tag pushed with `GITHUB_TOKEN` does **not** trigger a workflow run, so
#      the `push: tags` trigger below never fires for a release-please release.
#      The version tags therefore have to be attached to the image in this same
#      run, keyed off release-please's `release_created` output.
#   2. `release-type` is `simple` with `extra-files`, not `rust`. The `rust`
#      strategy always updates the root `Cargo.toml` with a `CargoToml` updater,
#      which throws `is not a package manifest (might be a cargo workspace)`
#      when the root has no `[package]` — and this root is a virtual workspace
#      whose version lives in `[workspace.package]`. Do not "fix" it back.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deliberately not `cancel-in-progress`: cancelling a publish half-way is how
  # a tag ends up pointing at one architecture.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Docker Hub is where releases went before the Rust rewrite, and that
  # repository is still public — with `latest` frozen on the retired Elixir
  # build until this publishes again.
  DOCKERHUB_IMAGE: docker.io/${{ github.repository }}

jobs:
  release-please:
    name: release-please
    # Only on `main`: a tag push is already a release, and dispatching this from
    # another branch would open a release PR nobody asked for.
    if: github.ref == 'refs/heads/main'
    # Granted per job rather than workflow-wide, so the jobs that only build an
    # image cannot write to the repository or open a pull request.
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # googleapis/release-please-action v4.4.1
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    name: build (${{ matrix.platform }})
    # Granted per job rather than workflow-wide, so a job that only reads the
    # repository is not able to publish anything.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # docker/setup-buildx-action v3.12.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      # docker/login-action v3.7.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        # docker/build-push-action v6.19.2
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Pushed by digest only. The `publish` job attaches the tags, because
          # naming a tag here would race the other architecture for it. The
          # repository name is still required: `push-by-digest` needs to know
          # where the digest goes, and buildx fails with `tag is needed when
          # pushing to registry` without it.
          outputs: >-
            type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # The Rust build is the expensive part, so the layer cache matters
          # more than usual. Scoped per architecture: the two caches hold
          # different binaries and must not be mixed.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Collect the digest
        env:
          # Passed through the environment rather than interpolated into the
          # script: a step output is data, and this way it cannot be read as
          # shell syntax.
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs: [image, release-please]
    # `always()` so that a skipped `release-please` (a tag push, where the job's
    # `if` does not hold) does not skip the publish as well. `needs.image`
    # succeeding is what actually gates this job, so a failed build still stops
    # here. A skipped job's outputs read as empty strings, which the tag step
    # below treats as "no release in this run".
    if: ${{ always() && needs.image.result == 'success' }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      # At job level rather than on the steps, because a step cannot read
      # `secrets` in its own `if`: a missing or rotated secret has to *skip* the
      # Docker Hub push, not fail the release.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      # docker/setup-buildx-action v3.12.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      # docker/login-action v3.7.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker/login-action v3.7.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: env.DOCKERHUB_USERNAME != ''
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - id: meta
        # docker/metadata-action v5.10.0
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Create the manifest list
        # One tag that resolves to whichever architecture is pulling it.
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.IMAGE }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
        run: |
          set -euo pipefail
          # Two argument lists, both built as arrays: the digests are discovered
          # from the working directory, so there is nothing to quote a literal
          # against and word-splitting a string would be the bug, not the fix.
          shopt -s nullglob
          tag_args=()
          digest_args=()
          # Tags that come from the pushed ref: `edge` on main, semver from the
          # ref on a `v*` tag push. metadata-action emits these already fully
          # qualified (`ghcr.io/owner/repo:tag`), so they are used as given.
          while IFS= read -r ref; do
            tag_args+=("-t" "$ref")
          done < <(jq -r '(.tags // [])[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # A release-please release cannot rely on the `push: tags` trigger: the
          # tag is created with `GITHUB_TOKEN`, and GitHub does not run workflows
          # for events that token creates. So the versioned tags are attached
          # here, in the same run, from release-please's own outputs.
          if [[ "$RELEASE_CREATED" == "true" && -n "$RELEASE_TAG" ]]; then
            bare="${RELEASE_TAG#v}"
            tag_args+=("-t" "${IMAGE}:${bare}")
            tag_args+=("-t" "${IMAGE}:${bare%.*}")
            tag_args+=("-t" "${IMAGE}:latest")
          fi
          # Each uploaded artifact is a bare sha256, so the reference is the
          # image name plus that digest.
          for digest in *; do
            digest_args+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

          # Docker Hub gets the version tags only. `edge` and the per-commit
          # `sha-` tags stay on GHCR: a registry nobody browses does not need a
          # tag per merge, and the Docker Hub repository has only ever carried
          # semver tags and `latest`.
          if [[ "${DOCKERHUB_USERNAME:-}" == "" ]]; then
            echo "DOCKERHUB_USERNAME is unset; skipped the Docker Hub push."
            exit 0
          fi
          hub_args=()
          while IFS= read -r ref; do
            name="${ref##*:}"
            case "$name" in
              edge|sha-*) continue ;;
            esac
            hub_args+=("-t" "${DOCKERHUB_IMAGE}:${name}")
          done < <(jq -r '(.tags // [])[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [[ "$RELEASE_CREATED" == "true" && -n "$RELEASE_TAG" ]]; then
            bare="${RELEASE_TAG#v}"
            hub_args+=("-t" "${DOCKERHUB_IMAGE}:${bare}")
            hub_args+=("-t" "${DOCKERHUB_IMAGE}:${bare%.*}")
            hub_args+=("-t" "${DOCKERHUB_IMAGE}:latest")
          fi
          if [[ ${#hub_args[@]} -eq 0 ]]; then
            echo "no version tag in this run; nothing to publish to Docker Hub."
            exit 0
          fi
          # Same digests, second registry: this copies the manifests rather than
          # rebuilding, so the two registries cannot drift apart.
          docker buildx imagetools create "${hub_args[@]}" "${digest_args[@]}"
      - name: Inspect what was published
        env:
          IMAGE: ${{ env.IMAGE }}
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          # A release run tags the version rather than `edge`, so inspect that.
          # The strip and the default are two separate steps on purpose:
          # `${RELEASE_TAG#v:-$VERSION}` is not valid bash and silently leaves
          # the `v` prefix in place.
          tag="${RELEASE_TAG#v}"
          tag="${tag:-$VERSION}"
          docker buildx imagetools inspect "${IMAGE}:${tag}"
          # Docker Hub only carries release tags, so on a plain `main` push it
          # has nothing to inspect and asking would fail the job.
          if [[ -n "${DOCKERHUB_USERNAME:-}" && "$tag" != "edge" && "$tag" != sha-* ]]; then
            docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${tag}"
          fi
