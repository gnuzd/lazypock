name: Release

# Automatic release pipeline (replaces the old manual workflow_dispatch).
#
# Flow:
#   1. Every push to `main` runs release-please against the repo ROOT (the
#      release component is the whole repository — the `core` Elixir app plus
#      the `studio` SPA that gets bundled into the core binary; see
#      release-please-config.json). If the commits since the last release
#      include `fix:` / `feat:` / BREAKING CHANGE (conventional commits), it
#      opens (or updates) a release PR — "chore(main): release vX.Y.Z" — with
#      the `core/mix.exs` version bump + `core/CHANGELOG.md`.
#   2. Merging that release PR pushes the bump to `main`, release-please
#      creates the GitHub Release + `vX.Y.Z` tag, and the build job in this
#      same run runs the test suite, builds the Burrito binaries (macOS +
#      Linux), and attaches them to the release.
#   3. The `docker` job builds and smoke-tests that release for linux/amd64 and
#      linux/arm64 on native runners, and `docker-push` publishes one
#      multi-arch image (`gnuzd/lazypock:X.Y.Z`, `X.Y`, `latest`). Each variant
#      wraps the Linux asset built for its architecture — downloaded back from
#      the release and checked against `checksums-sha256.txt` first.
#
# Commit messages on `main` should follow conventional commits
# (e.g. `fix(core): ...`, `fix(studio): ...`, `feat(studio): ...`, `chore: ...`)
# so the next version is chosen correctly. `BREAKING CHANGE:` in the body
# bumps major. Changes under `example/` are excluded from versioning.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # Root-package manifest releases emit unprefixed outputs (no `core--`).
      release_created: ${{ steps.release.outputs.release_created }}
      upload_url: ${{ steps.release.outputs.upload_url }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: release-please-manifest.json

  # ── Only runs when release-please just created a release (release PR
  #    merged): checkout the released code, test it, build the Burrito
  #    binaries, and attach them to the release. ──
  build:
    name: Test, build & attach binaries
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lazypock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Elixir & Erlang
        uses: erlef/setup-beam@v1.18.2
        with:
          elixir-version: "1.17.3"
          otp-version: "27.1.2"

      - name: Setup Bun (studio SPA build)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Pin the exact Zig version Burrito requires (see core/mix.lock —
      # burrito 1.6.0 expects 0.16.0; the action's default is a dev build).
      - name: Setup Zig (burrito wrapper)
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Mix deps
        working-directory: core
        run: mix deps.get

      - name: Install Studio deps
        working-directory: studio
        run: bun install --frozen-lockfile

      # Ubuntu LTS ships ImageMagick 6, which provides `convert`/`identify` but
      # no `magick` binary; tests resolve `magick` or `convert` (see TestImage).
      - name: Install ImageMagick (tests need `magick`/`convert`)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Run tests
        working-directory: core
        env:
          MIX_ENV: test
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          # Retry once — the async suite has a known rare flake
          # (hooks RegistryTest :should_not_run race)
          mix test --max-cases 8 || mix test --max-cases 8

      - name: Deploy assets (studio build + phx.digest)
        working-directory: core
        run: mix assets.deploy

      - name: Build Burrito release
        working-directory: core
        env:
          MIX_ENV: prod
        run: |
          mix release --overwrite
          ls -la burrito_out/

      - name: Prepare release assets
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          mkdir -p dist
          cp core/burrito_out/lazypock_macos_silicon \
            "dist/lazypock-${VERSION}-darwin-arm64"
          cp core/burrito_out/lazypock_linux \
            "dist/lazypock-${VERSION}-linux-x86_64"
          cp core/burrito_out/lazypock_linux_arm64 \
            "dist/lazypock-${VERSION}-linux-arm64"
          chmod +x dist/*
          cd dist && sha256sum * > checksums-sha256.txt

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # v2 resolves the release by tag (upload_url was a v1-only input)
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            dist/lazypock-*
            dist/checksums-sha256.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ── Builds and smoke-tests the image for each architecture on its own
  #    runner, so both are verified natively (no emulation) before anything
  #    is published. `docker-push` then assembles the multi-arch manifest
  #    from those cached layers and applies the release tags. ──
  docker:
    name: Smoke test image (${{ matrix.arch }})
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `arch` is buildx's TARGETARCH, which the Dockerfile uses to pick the
          # binary; `asset` is the matching suffix of the release asset.
          - arch: amd64
            runner: ubuntu-latest
            asset: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            asset: arm64
    runs-on: ${{ matrix.runner }}
    services:
      # Real database for the smoke test below — the app migrates on boot, so
      # booting against Postgres is what proves the image actually works.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lazypock_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Docker Hub convention is bare semver: git tag `v1.2.3` publishes as
      # `1.2.3`, plus the rolling `1.2` and `latest`.
      - name: Resolve image tags
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version="${TAG_NAME#v}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "MINOR=${version%.*}" >> "$GITHUB_ENV"

      # Downloading the asset back from the release (instead of reusing the
      # build job's workspace) exercises the exact public download path users
      # follow, and the checksum check catches a corrupt/partial upload.
      - name: Download & verify the released Linux binary
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          ASSET_ARCH: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          base="$url/releases/download/${TAG_NAME}"
          asset="lazypock-${VERSION}-linux-${ASSET_ARCH}"
          curl -fsSL -o "$asset" "$base/$asset"
          curl -fsSL -o checksums-sha256.txt "$base/checksums-sha256.txt"
          # Assert the line exists first: an unmatched name would feed
          # `sha256sum -c` an empty stream, and that exits 0 on some platforms.
          line="$(grep -F "  ${asset}" checksums-sha256.txt || true)"
          if [ -z "$line" ]; then
            echo "::error::no checksum for ${asset} in the release"
            exit 1
          fi
          # Only this architecture's line is verified; the other is left be.
          echo "$line" | sha256sum -c -
          # The Dockerfile picks its binary by buildx's TARGETARCH.
          mv "$asset" "lazypock-linux-${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and load only — nothing is pushed until every smoke test has
      # passed, so a broken image never reaches Docker Hub.
      - name: Build image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: lazypock:smoke
          # `docker-push` reuses these layers for the multi-arch manifest
          # instead of rebuilding arm64 under emulation.
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Smoke test image (boot, health, Studio, graceful stop)
        run: |
          set -euo pipefail
          container=lazypock-smoke
          # Dump the container's logs if any assertion below fails.
          trap 'docker logs "$container" 2>/dev/null | tail -n 40 || true' EXIT

          # --network host: the app reaches the job's Postgres on 127.0.0.1.
          db="ecto://postgres:postgres@127.0.0.1:5432/lazypock_smoke"
          docker run -d --name "$container" --network host \
            -e DATABASE_URL="$db" \
            -e SECRET_KEY_BASE="$(openssl rand -base64 48)" \
            -e LAZYPOCK_STORAGE_PATH=/tmp/uploads \
            lazypock:smoke

          # First boot extracts the release, creates the schema and seeds the
          # superuser, so allow it up to a minute; bail out early if it dies.
          base="http://127.0.0.1:4000"
          health=""
          for _ in $(seq 1 30); do
            if health="$(curl -fsS "$base/api/health")"; then
              break
            fi
            running="$(docker inspect -f '{{.State.Running}}' "$container")"
            if [ "$running" != "true" ]; then
              echo "::error::the container exited during boot"
              exit 1
            fi
            sleep 2
          done
          if [ -z "$health" ]; then
            echo "::error::/api/health never answered"
            exit 1
          fi
          echo "$health"

          # The bundled Studio SPA must be served as well.
          curl -fsS -o /dev/null "$base/_/"

          # The entrypoint forwards SIGTERM to the BEAM, so stopping must be
          # quick; exit code 137 means it was SIGKILLed (forwarding broke).
          docker stop --timeout 30 "$container" >/dev/null
          code="$(docker inspect -f '{{.State.ExitCode}}' "$container")"
          if [ "$code" = "137" ]; then
            echo "::error::the container was SIGKILLed, not stopped"
            exit 1
          fi

  # ── Publishes the release as one multi-arch manifest (linux/amd64 +
  #    linux/arm64). Both platforms were smoke-tested above, so this job only
  #    re-assembles their cached layers; a cache miss for arm64 would fall back
  #    to emulation, hence the emulator setup. ──
  docker-push:
    name: Publish multi-arch image
    needs: [release-please, build, docker]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      IMAGE: gnuzd/lazypock
      # OCI `source` label (kept as a variable to stay within 80 columns).
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tags
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version="${TAG_NAME#v}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "MINOR=${version%.*}" >> "$GITHUB_ENV"

      - name: Download & verify both Linux binaries
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          base="$url/releases/download/${TAG_NAME}"
          curl -fsSL -o checksums-sha256.txt "$base/checksums-sha256.txt"
          # `arch` is buildx's TARGETARCH; the pair's right side is the release
          # asset suffix (amd64 is published as x86_64).
          for pair in amd64=x86_64 arm64=arm64; do
            arch="${pair%%=*}"
            asset="lazypock-${VERSION}-linux-${pair##*=}"
            curl -fsSL -o "$asset" "$base/$asset"
            line="$(grep -F "  ${asset}" checksums-sha256.txt || true)"
            if [ -z "$line" ]; then
              echo "::error::no checksum for ${asset} in the release"
              exit 1
            fi
            echo "$line" | sha256sum -c -
            mv "$asset" "lazypock-linux-${arch}"
          done

      - name: Set up QEMU (fallback if the arm64 cache misses)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push multi-arch manifest
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ env.MINOR }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=LazyPock
            org.opencontainers.image.description=PocketBase-compatible backend
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ env.REPO_URL }}
            org.opencontainers.image.licenses=MIT
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
