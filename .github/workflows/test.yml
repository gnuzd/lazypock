name: Test

# Runs the backend test suite on `main` and on every pull request, so the
# README's "tests" badge reflects the current state of `main` and every
# PR is gated on a green suite. (Release-time testing + binary builds
# live in release.yml.)
#
# `push` is pinned to `main`: a bare `push` also fires for every branch that
# has a PR open (branches live in this repo, not a fork), running the whole
# suite twice for the same commit. The `pull_request` run is the gate; the
# post-merge run keeps the badge fresh.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: mix test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lazypock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir & Erlang
        uses: erlef/setup-beam@v1.18.2
        with:
          elixir-version: "1.17.3"
          otp-version: "27.1.2"

      - name: Install ImageMagick (tests need `magick`/`convert`)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Install Mix deps
        working-directory: core
        run: mix deps.get

      - name: Run tests with coverage
        working-directory: core
        env:
          MIX_ENV: test
        run: |
          # `pipefail` is essential here: without it a pipeline's exit status is
          # `tee`'s (always 0): `mix test … | tee cover.txt` reported this job
          # as green even when the suite printed failures.
          set -o pipefail
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          # Retry once — the async suite has a known rare flake
          # (hooks RegistryTest :should_not_run race). The report from the
          # successful run is kept for the coverage gate below.
          mix test --max-cases 8 --cover 2>&1 | tee cover.txt || \
            mix test --max-cases 8 --cover 2>&1 | tee cover.txt

      # Fails the build if the rule enforcer / filter compiler drop below their
      # per-module coverage floors. This is deliberately separate from the
      # global threshold in mix.exs, which high coverage elsewhere could mask.
      - name: Enforce access-control coverage gate
        working-directory: core
        run: elixir scripts/check_rule_coverage.exs cover.txt
