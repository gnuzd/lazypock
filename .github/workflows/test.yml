name: Test

# Runs the backend test suite on every push and pull request, so the
# README's "tests" badge reflects the current state of `main` and every
# PR is gated on a green suite. (Release-time testing + binary builds
# live in release.yml.)
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: mix test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lazypock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir & Erlang
        uses: erlef/setup-beam@v1.18.2
        with:
          elixir-version: "1.17.3"
          otp-version: "27.1.2"

      - name: Install ImageMagick (tests need `magick`/`convert`)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Install Mix deps
        working-directory: core
        run: mix deps.get

      - name: Run tests
        working-directory: core
        env:
          MIX_ENV: test
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          # Retry once — the async suite has a known rare flake
          # (hooks RegistryTest :should_not_run race)
          mix test --max-cases 8 || mix test --max-cases 8
